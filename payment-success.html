<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful | TIKGROW</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 padding:20px;background:#eef7ff;
 font-family:Arial,sans-serif;color:#10243e;
}
.card{
 width:100%;max-width:440px;background:white;
 padding:35px 25px;border-radius:22px;text-align:center;
 box-shadow:0 15px 45px rgba(20,91,160,.12);
}
.check{
 width:75px;height:75px;border-radius:50%;
 display:grid;place-items:center;margin:0 auto 20px;
 background:#e5f8ed;color:#15934b;font-size:42px;
}
h1{font-size:27px;margin:10px 0}
p{color:#718198;line-height:1.6}
.order{
 background:#eef7ff;border-radius:13px;padding:16px;
 margin:22px 0;font-size:13px;overflow-wrap:anywhere;
}
.order strong{display:block;margin-top:8px;color:#0875e8}
a{
 display:block;background:#168bfa;color:white;
 text-decoration:none;padding:15px;border-radius:11px;
 font-weight:bold;margin-top:12px;
}
.secondary{background:white;color:#168bfa;border:1px solid #b9dcff}
</style>
</head>
<body>
<div class="card">
 <div class="check">✓</div>
 <h1>Payment Successful!</h1>
 <p>Your payment has been verified. Thank you for choosing TIKGROW.</p>

 <div class="order">
   Your Order Reference
   <strong id="orderCode">Loading...</strong>
 </div>

 <p>Keep your order reference for future tracking.</p>
 <a href="/">Return to TIKGROW Home</a>
 <a class="secondary" href="/admin.html">Admin Login</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const order = params.get("order");
document.getElementById("orderCode").textContent =
 order || "Reference unavailable";
if (!order) {
 document.querySelector(".card p").textContent =
 "We could not read your order reference. Please contact TIKGROW support.";
}
</script>
</body>
</html>
