
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIKGROW Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080a10;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#111722;border-bottom:1px solid #283341;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:25px;font-weight:900}.logo span{color:#25f4ee}
main{max-width:1150px;margin:auto;padding:20px}
h1{font-size:27px}
.muted{color:#9ba5b5;font-size:13px}
button{border:0;border-radius:8px;padding:11px 14px;font-weight:bold;cursor:pointer;background:#25f4ee;color:#061014}
button.secondary{background:#252d3a;color:white}
button.danger{background:#fe2c55;color:white}
input,select{background:#101722;color:white;border:1px solid #354151;border-radius:8px;padding:11px;width:100%;min-width:0}
.login{max-width:420px;margin:90px auto;background:#121a26;border:1px solid #263444;border-radius:18px;padding:25px}
.login button{width:100%;margin-top:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.stat,.panel{background:#121a26;border:1px solid #263444;border-radius:14px;padding:17px}
.stat strong{display:block;font-size:27px;margin-top:10px;color:#25f4ee}
.toolbar{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;margin:20px 0}
.order{background:#121a26;border:1px solid #293545;border-radius:14px;padding:18px;margin:13px 0}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.id{color:#25f4ee;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}
.detail{background:#0b111b;padding:11px;border-radius:9px;overflow-wrap:anywhere}
.detail small{display:block;color:#93a0b1;margin-bottom:5px}
.actions{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;margin-top:14px}
.price{display:flex;gap:8px;margin-top:13px}
.price input{max-width:160px}
.status{padding:6px 10px;border-radius:20px;background:#263341;font-size:12px}
a{color:#25f4ee}
#message{margin:15px 0;color:#25f4ee}
@media(max-width:650px){
.stats{grid-template-columns:repeat(2,1fr)}
.toolbar{grid-template-columns:1fr}
.grid{grid-template-columns:1fr}
.actions{grid-template-columns:1fr}
.price input{max-width:none}
}
</style>
</head>
<body>
<header>
 <div class="logo">TIK<span>GROW</span> <small style="font-size:12px;color:#aaa">ADMIN</small></div>
 <button class="secondary" onclick="logout()">Logout</button>
</header>

<div id="loginBox" class="login">
 <h1>Admin Login</h1>
 <p class="muted">Secure TIKGROW management dashboard</p>
 <input id="token" type="password" placeholder="Admin access token">
 <button onclick="login()">ACCESS DASHBOARD</button>
 <div id="loginMessage" class="muted"></div>
</div>

<main id="dashboard" hidden>
 <h1>Dashboard Overview</h1>
 <p class="muted">Manage customer orders, campaign prices and promotion progress.</p>

 <div class="stats">
  <div class="stat">Total Orders<strong id="total">0</strong></div>
  <div class="stat">New Orders<strong id="new">0</strong></div>
  <div class="stat">Paid Orders<strong id="paid">0</strong></div>
  <div class="stat">Completed<strong id="completed">0</strong></div>
 </div>

 <div class="toolbar">
  <input id="search" placeholder="Search order, phone or service..." oninput="render()">
  <select id="filter" onchange="render()">
   <option value="">All Orders</option>
   <option>New</option>
   <option>Awaiting Payment</option>
   <option>Paid</option>
   <option>In Progress</option>
   <option>Completed</option>
   <option>Cancelled</option>
  </select>
  <button onclick="loadOrders()">REFRESH</button>
 </div>

 <div class="top">
  <h2>Customer Orders</h2>
  <button class="secondary" onclick="exportCSV()">EXPORT CSV</button>
 </div>
 <div id="message"></div>
 <div id="orders"></div>
</main>

<script>
let orders=[];
let adminToken=sessionStorage.getItem("tikgrow_admin_token")||"";

async function api(url,options={}){
 options.headers={...(options.headers||{}),"x-admin-token":adminToken};
 const response=await fetch(url,options);
 const data=await response.json();
 if(!response.ok)throw new Error(data.error||"Request failed");
 return data;
}

async function login(){
 adminToken=document.getElementById("token").value.trim();
 if(!adminToken){document.getElementById("loginMessage").textContent="Enter your admin token.";return;}
 try{
  await loadOrders();
  sessionStorage.setItem("tikgrow_admin_token",adminToken);
  document.getElementById("loginBox").hidden=true;
  document.getElementById("dashboard").hidden=false;
 }catch(e){
  document.getElementById("loginMessage").textContent=e.message;
 }
}

function logout(){
 sessionStorage.removeItem("tikgrow_admin_token");
 adminToken="";
 location.reload();
}

async function loadOrders(){
 const data=await api("/api/admin/orders");
 orders=Array.isArray(data)?data:(data.orders||[]);
 render();
 updateStats();
 document.getElementById("message").textContent="Orders refreshed successfully.";
}

function updateStats(){
 document.getElementById("total").textContent=orders.length;
 document.getElementById("new").textContent=orders.filter(o=>o.status==="New").length;
 document.getElementById("paid").textContent=orders.filter(o=>o.status==="Paid"||o.paid_at).length;
 document.getElementById("completed").textContent=orders.filter(o=>o.status==="Completed").length;
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render(){
 const query=document.getElementById("search").value.toLowerCase();
 const filter=document.getElementById("filter").value;
 const list=orders.filter(o=>{
  const text=[o.order_code,o.customer_name,o.contact,o.service,o.tiktok_link,o.details].join(" ").toLowerCase();
  return text.includes(query)&&(!filter||o.status===filter);
 });
 const area=document.getElementById("orders");
 if(!list.length){area.innerHTML='<div class="panel">No matching orders found.</div>';return;}
 area.innerHTML=list.map(o=>{
  const id=Number(o.id);
  const code=escapeHTML(o.order_code);
  const phone=escapeHTML(o.contact);
  const price=Number(o.price_ghs||0);
  const link=String(o.tiktok_link||"");
  const safeLink=/^https:\/\/(www\.)?tiktok\.com\//i.test(link)?link:"";
  return `
  <section class="order">
   <div class="top">
    <span class="id">${code}</span>
    <span class="status">${escapeHTML(o.status)}</span>
   </div>
   <div class="grid">
    <div class="detail"><small>Customer</small>${escapeHTML(o.customer_name||"Customer")}</div>
    <div class="detail"><small>Phone</small>${phone}</div>
    <div class="detail"><small>Service</small>${escapeHTML(o.service)}</div>
    <div class="detail"><small>Price</small>GH₵${price.toFixed(2)}</div>
    <div class="detail"><small>TikTok Link</small>${safeLink?`<a href="${escapeHTML(safeLink)}" target="_blank" rel="noopener">Open TikTok</a>`:"Not available"}</div>
    <div class="detail"><small>Payment</small>${o.paid_at?"Paid":"Not confirmed as paid"}</div>
    <div class="detail"><small>Details</small>${escapeHTML(o.details||"None")}</div>
    <div class="detail"><small>Created</small>${escapeHTML(o.created_at||"")}</div>
   </div>
   <div class="price">
    <input type="number" min="0.01" step="0.01" id="price-${id}" value="${price||""}" placeholder="Price in GH₵">
    <button onclick="setPrice(${id})">SAVE PRICE</button>
   </div>
   <div class="actions">
    <select id="status-${id}">
     ${["New","Awaiting Payment","In Progress","Completed","Cancelled"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}
    </select>
    <button class="secondary" onclick="updateStatus(${id})">UPDATE STATUS</button>
    <button class="secondary" onclick="copyCode('${code}')">COPY ID</button>
   </div>
  </section>`;
 }).join("");
}

async function setPrice(id){
 const value=Number(document.getElementById("price-"+id).value);
 if(!Number.isFinite(value)||value<=0){alert("Enter a valid price.");return;}
 try{
  await api("/api/admin/orders/"+id+"/price",{
   method:"PATCH",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({price_ghs:value})
  });
  document.getElementById("message").textContent="Price saved. Customer can now check the order for payment.";
  await loadOrders();
 }catch(e){alert(e.message);}
}

async function updateStatus(id){
 const status=document.getElementById("status-"+id).value;
 try{
  await api("/api/admin/orders/"+id,{
   method:"PATCH",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({status})
  });
  await loadOrders();
 }catch(e){alert(e.message);}
}

function copyCode(code){
 if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>alert("Order ID copied."));
 else alert(code);
}

function exportCSV(){
 const rows=[["Order ID","Phone","Service","Price GHS","Status","Created"]];
 orders.forEach(o=>rows.push([o.order_code,o.contact,o.service,o.price_ghs,o.status,o.created_at]));
 const csv=rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
 const blob=new Blob([csv],{type:"text/csv"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="tikgrow-orders.csv";a.click();
 URL.revokeObjectURL(url);
}

if(adminToken){
 loadOrders().then(()=>{
  document.getElementById("loginBox").hidden=true;
  document.getElementById("dashboard").hidden=false;
 }).catch(()=>logout());
}
</script>
</body>
</html>
