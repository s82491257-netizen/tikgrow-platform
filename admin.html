
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIKGROW Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b13;color:#fff;font-family:Arial,sans-serif}
header{background:#101827;border-bottom:1px solid #26364b;padding:20px}
.top{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:27px;font-weight:900;letter-spacing:2px}
.logo span{color:#25f4ee}
.container{max-width:1200px;margin:25px auto;padding:0 15px}
.card{background:#111a29;border:1px solid #26364b;border-radius:15px;padding:20px;margin-bottom:18px}
h2{margin-top:0}
.muted{color:#9aaac0;font-size:13px}
input,select{width:100%;padding:13px;border:1px solid #35465f;background:#080f1c;color:white;border-radius:9px;font-size:15px}
button{padding:12px 16px;border:0;border-radius:9px;background:#25f4ee;color:#061016;font-weight:bold;cursor:pointer}
button.secondary{background:#25344b;color:white}
button.danger{background:#fe2c55;color:white}
button:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#0a1220;border:1px solid #26364b;border-radius:12px;padding:17px}
.stat small{color:#9aabc0}
.stat strong{display:block;font-size:25px;margin-top:9px;color:#25f4ee;overflow-wrap:anywhere}
.controls{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}
.order{background:#0a1220;border:1px solid #26364b;border-radius:13px;padding:17px;margin-top:13px}
.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.orderid{font-weight:900;color:#25f4ee}
.details{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}
.detail{background:#111a29;padding:11px;border-radius:8px;overflow-wrap:anywhere}
.detail small{display:block;color:#9aabc0;margin-bottom:5px}
.statusrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.statusrow select{max-width:220px}
.paid{color:#25f4ee;font-weight:bold}
.unpaid{color:#ff8498;font-weight:bold}
.tag{font-size:11px;padding:6px 9px;border-radius:20px;background:#183b40;color:#25f4ee}
.tag.red{background:#411b29;color:#ff9bad}
a{color:#25f4ee;overflow-wrap:anywhere}
.hidden{display:none}
#message{padding:12px;margin-top:12px;border-radius:8px;background:#183b40;color:#25f4ee;display:none}
@media(max-width:700px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .controls{grid-template-columns:1fr 1fr}
 .controls input{grid-column:1/-1}
 .details{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
 <div class="top">
  <div class="logo">TIK<span>GROW</span> <small style="font-size:12px;color:#a8b5c8">ADMIN</small></div>
  <div>
   <button class="secondary" id="refreshBtn" onclick="loadOrders()">↻ Refresh</button>
   <button class="danger" onclick="logout()">Logout</button>
  </div>
 </div>
</header>

<main class="container">

<section class="card" id="loginCard">
 <h2>Admin Login</h2>
 <p class="muted">Enter your private admin token to manage TIKGROW orders.</p>
 <input id="tokenInput" type="password" placeholder="Admin token">
 <button style="width:100%;margin-top:12px" onclick="login()">LOGIN TO DASHBOARD</button>
 <div id="loginMessage" class="muted"></div>
</section>

<section id="dashboard" class="hidden">

 <div class="card">
  <h2>Dashboard Overview</h2>
  <p class="muted">Monitor your orders, payments and campaign activity.</p>
  <div class="stats">
   <div class="stat"><small>Total Orders</small><strong id="totalOrders">0</strong></div>
   <div class="stat"><small>Paid Orders</small><strong id="paidOrders">0</strong></div>
   <div class="stat"><small>Unpaid Orders</small><strong id="unpaidOrders">0</strong></div>
   <div class="stat"><small>Total Paid Sales</small><strong id="totalSales">GH₵0.00</strong></div>
  </div>
 </div>

 <div class="card">
  <h2>Order Management</h2>
  <div class="controls">
   <input id="search" placeholder="Search Order ID, phone or TikTok link" oninput="renderOrders()">
   <select id="serviceFilter" onchange="renderOrders()">
    <option value="">All Services</option>
    <option>TikTok Likes</option>
    <option>Comments</option>
    <option>Followers</option>
    <option>Video Views</option>
    <option>Shares</option>
    <option>LIVE Promotion</option>
   </select>
   <select id="statusFilter" onchange="renderOrders()">
    <option value="">All Statuses</option>
    <option>New</option>
    <option>Awaiting Payment</option>
    <option>Paid</option>
    <option>In Progress</option>
    <option>Completed</option>
    <option>Cancelled</option>
   </select>
   <button class="secondary" onclick="exportCSV()">Export CSV</button>
  </div>
  <div id="message"></div>
  <div id="ordersList"></div>
 </div>

 <p class="muted" style="text-align:center">TIKGROW ADMIN · Automatic refresh every 30 seconds</p>
</section>
</main>

<script>
let adminToken = sessionStorage.getItem("tikgrow_admin_token") || "";
let orders = [];
let refreshTimer = null;

function escapeHTML(value) {
 return String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function showMessage(message) {
 const box = document.getElementById("message");
 box.textContent = message;
 box.style.display = "block";
}

function login() {
 const token = document.getElementById("tokenInput").value.trim();
 if (!token) {
  document.getElementById("loginMessage").textContent = "Enter your admin token.";
  return;
 }
 adminToken = token;
 sessionStorage.setItem("tikgrow_admin_token", token);
 loadOrders(true);
}

function logout() {
 sessionStorage.removeItem("tikgrow_admin_token");
 adminToken = "";
 orders = [];
 clearInterval(refreshTimer);
 document.getElementById("dashboard").classList.add("hidden");
 document.getElementById("loginCard").classList.remove("hidden");
 document.getElementById("tokenInput").value = "";
}

async function api(url, options={}) {
 const response = await fetch(url, {
  ...options,
  headers:{
   "Content-Type":"application/json",
   "x-admin-token":adminToken,
   ...(options.headers || {})
  }
 });
 const data = await response.json().catch(() => ({}));
 if (!response.ok) {
  if (response.status === 401 || response.status === 403) {
   throw new Error("Admin token rejected. Please log in again.");
  }
  throw new Error(data.error || data.message || "Request failed.");
 }
 return data;
}

async function loadOrders(fromLogin=false) {
 const button = document.getElementById("refreshBtn");
 if (button) {
  button.disabled = true;
  button.textContent = "Refreshing...";
 }

 try {
  if (!adminToken) throw new Error("Please log in.");

  const data = await api("/api/admin/orders");
  orders = Array.isArray(data) ? data : (data.orders || []);

  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  updateStats();
  renderOrders();
  document.getElementById("message").style.display = "none";

  if (!refreshTimer) {
   refreshTimer = setInterval(() => loadOrders(), 30000);
  }
 } catch(error) {
  if (fromLogin || error.message.includes("token")) {
   document.getElementById("loginCard").classList.remove("hidden");
   document.getElementById("dashboard").classList.add("hidden");
   document.getElementById("loginMessage").textContent = error.message;
   sessionStorage.removeItem("tikgrow_admin_token");
   adminToken = "";
  } else {
   showMessage("Refresh failed: " + error.message);
  }
 } finally {
  if (button) {
   button.disabled = false;
   button.textContent = "↻ Refresh";
  }
 }
}

function updateStats() {
 const paid = orders.filter(o => o.paid_at || String(o.payment_status || "").toLowerCase() === "paid");
 const unpaid = orders.length - paid.length;
 const sales = paid.reduce((sum,o) => sum + Number(o.price_ghs || 0), 0);

 document.getElementById("totalOrders").textContent = orders.length;
 document.getElementById("paidOrders").textContent = paid.length;
 document.getElementById("unpaidOrders").textContent = unpaid;
 document.getElementById("totalSales").textContent = "GH₵" + sales.toFixed(2);
}

function renderOrders() {
 const search = document.getElementById("search").value.toLowerCase();
 const service = document.getElementById("serviceFilter").value;
 const status = document.getElementById("statusFilter").value;

 const filtered = orders.filter(o => {
  const searchable = [
   o.order_code,o.contact,o.service,o.tiktok_link,o.status
  ].join(" ").toLowerCase();

  return searchable.includes(search) &&
   (!service || o.service === service) &&
   (!status || o.status === status);
 });

 const list = document.getElementById("ordersList");

 if (!filtered.length) {
  list.innerHTML = '<p class="muted">No matching orders found.</p>';
  return;
 }

 list.innerHTML = filtered.map(o => {
  const id = Number(o.id);
  const paid = Boolean(o.paid_at) || String(o.payment_status || "").toLowerCase() === "paid";
  const payment = paid ? "Paid" : "Unpaid";
  const price = Number(o.price_ghs || 0);
  const options = ["New","Awaiting Payment","Paid","In Progress","Completed","Cancelled"];
  const current = options.includes(o.status) ? o.status : "New";

  return `
   <article class="order">
    <div class="orderhead">
     <div class="orderid">${escapeHTML(o.order_code || "Order")}</div>
     <span class="tag ${paid ? "" : "red"}">${payment.toUpperCase()}</span>
    </div>

    <div class="details">
     <div class="detail"><small>Customer Phone</small>${escapeHTML(o.contact || "Not provided")}</div>
     <div class="detail"><small>Service</small>${escapeHTML(o.service || "-")}</div>
     <div class="detail"><small>Quantity</small>${Number(o.quantity || 0).toLocaleString()}</div>
     <div class="detail"><small>Order Price</small><b>GH₵${price.toFixed(2)}</b></div>
     <div class="detail"><small>Payment</small><span class="${paid ? "paid" : "unpaid"}">${payment}</span></div>
     <div class="detail"><small>Order Status</small>${escapeHTML(o.status || "New")}</div>
    </div>

    <p class="muted">TikTok link:<br>
     <a href="${safeURL(o.tiktok_link)}" target="_blank" rel="noopener">Open TikTok campaign</a>
    </p>

    <p class="muted">Created: ${escapeHTML(o.created_at || "-")}</p>

    <div class="statusrow">
     <select id="status-${id}">
      ${options.map(s => `<option value="${s}" ${s === current ? "selected" : ""}>${s}</option>`).join("")}
     </select>
     <button onclick="updateStatus(${id})">Update Status</button>
     <button class="secondary" onclick="copyOrder('${escapeHTML(o.order_code || "")}')">Copy Order ID</button>
    </div>
   </article>`;
 }).join("");
}

function safeURL(value) {
 try {
  const url = new URL(value);
  if (url.protocol === "https:" && url.hostname === "www.tiktok.com" || url.protocol === "https:" && url.hostname === "tiktok.com") {
   return escapeHTML(url.href);
  }
 } catch(e) {}
 return "#";
}

async function updateStatus(id) {
 const select = document.getElementById("status-" + id);
 const newStatus = select.value;

 try {
  await api("/api/admin/orders/" + id, {
   method:"PATCH",
   body:JSON.stringify({status:newStatus})
  });
  showMessage("Order status updated.");
  await loadOrders();
 } catch(error) {
  showMessage("Could not update status: " + error.message);
 }
}

async function copyOrder(code) {
 try {
  await navigator.clipboard.writeText(code);
  showMessage("Order ID copied.");
 } catch(e) {
  showMessage("Copy is unavailable on this browser.");
 }
}

function exportCSV() {
 if (!orders.length) {
  showMessage("There are no orders to export.");
  return;
 }

 const columns = ["order_code","contact","service","quantity","price_ghs","payment_status","status","tiktok_link","created_at"];
 const rows = [columns.join(",")];

 orders.forEach(o => {
  rows.push(columns.map(key => {
   let value = key === "payment_status"
    ? (o.paid_at ? "Paid" : (o.payment_status || "Unpaid"))
    : (o[key] ?? "");
   return '"' + String(value).replace(/"/g,'""') + '"';
  }).join(","));
 });

 const blob = new Blob([rows.join("\n")], {type:"text/csv;charset=utf-8"});
 const url = URL.createObjectURL(blob);
 const a = document.createElement("a");
 a.href = url;
 a.download = "tikgrow-orders.csv";
 a.click();
 URL.revokeObjectURL(url);
}

if (adminToken) {
 document.getElementById("tokenInput").value = adminToken;
 loadOrders(true);
}
</script>
</body>
</html>
