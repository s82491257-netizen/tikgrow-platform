
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SavCel Hub Admin Setup</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#f4fbff,#dcefff);
  color:#18334d
}
.card{
  width:100%;
  max-width:430px;
  padding:30px;
  border-radius:22px;
  background:white;
  box-shadow:0 15px 45px #168ee820
}
.logo{font-size:25px;font-weight:900;color:#168ee8}
h2{margin-top:28px}
p{color:#718096;line-height:1.6}
input{
  width:100%;
  padding:15px;
  margin:15px 0;
  border:1px solid #cbdff0;
  border-radius:11px;
  font-size:15px
}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#168ee8;
  color:white;
  font-weight:bold;
  font-size:15px
}
#message{margin-top:18px;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">SavCel Hub</div>
  <h2>Administrator Setup</h2>
  <p>Enter your private setup token to activate administrator access for your logged-in account.</p>

  <form id="setupForm">
    <input
      id="token"
      type="password"
      placeholder="Private admin setup token"
      autocomplete="off"
      required
    >
    <button id="submitButton" type="submit">
      Activate Admin Account
    </button>
  </form>

  <div id="message"></div>
</div>

<script>
const form = document.getElementById("setupForm");
const message = document.getElementById("message");
const button = document.getElementById("submitButton");

form.addEventListener("submit", async function(event){
  event.preventDefault();

  const token = document.getElementById("token").value.trim();

  if(!token){
    message.textContent = "Enter your setup token.";
    return;
  }

  button.disabled = true;
  button.textContent = "Activating...";
  message.textContent = "";

  try{
    const response = await fetch("/api/admin/setup",{
      method:"POST",
      credentials:"same-origin",
      headers:{
        "Content-Type":"application/json",
        "x-admin-setup-token":token
      },
      body:JSON.stringify({})
    });

    const result = await response.json();

    if(response.ok && result.success){
      message.textContent = result.message;
      message.style.color = "#168447";
      document.getElementById("token").value = "";

      setTimeout(function(){
        window.location.href = "/admin";
      },1500);
    }else{
      message.textContent = result.message || "Admin setup failed.";
      message.style.color = "#d33";
    }
  }catch(error){
    message.textContent = "Connection error. Please try again.";
    message.style.color = "#d33";
  }

  button.disabled = false;
  button.textContent = "Activate Admin Account";
});
</script>
</body>
</html>
