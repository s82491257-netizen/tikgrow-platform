
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SavCel Hub - Admin Setup</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eaf6ff,#fff);
  color:#17324f
}
.card{
  background:white;
  width:100%;
  max-width:420px;
  padding:30px;
  border-radius:22px;
  box-shadow:0 15px 45px #12345618
}
h1{color:#1676d2;font-size:25px}
p{color:#687d91;line-height:1.6}
input{
  width:100%;
  padding:16px;
  margin:15px 0;
  border:1px solid #c9dced;
  border-radius:12px;
  font-size:16px
}
button{
  width:100%;
  padding:16px;
  background:#1676d2;
  color:white;
  border:0;
  border-radius:12px;
  font-weight:bold;
  font-size:16px
}
button:disabled{opacity:.6}
#message{margin-top:18px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card">
  <h1>Administrator Setup</h1>
  <p>Activate your SavCel Hub administrator account securely.</p>

  <form id="form">
    <input
      id="token"
      type="password"
      placeholder="Enter your Render setup token"
      autocomplete="off"
      required
    >
    <button id="button" type="submit">Activate Admin</button>
  </form>

  <div id="message"></div>
</div>

<script>
const form = document.getElementById("form");
const button = document.getElementById("button");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event){
  event.preventDefault();

  const token = document.getElementById("token").value.trim();

  button.disabled = true;
  message.textContent = "Verifying...";

  try {
    const response = await fetch("/api/admin/setup", {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json",
        "x-admin-setup-token": token
      },
      body: "{}"
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      message.textContent = result.message || "Activation failed.";
      button.disabled = false;
      return;
    }

    message.textContent = "Admin activated successfully!";

    window.location.href = "/admin";

  } catch(error) {
    message.textContent = "Connection error. Please try again.";
    button.disabled = false;
  }
});
</script>
</body>
</html>
